global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: sensor-simulator
    static_configs:
      - targets: ['sensor-simulator:8000']

  - job_name: ingestion-gateway
    static_configs:
      - targets: ['ingestion-gateway:8000']

  - job_name: telemetry-service
    static_configs:
      - targets: ['telemetry-service:8000']

  - job_name: rule-engine
    static_configs:
      - targets: ['rule-engine:8000']

  - job_name: alert-service
    static_configs:
      - targets: ['alert-service:8000']

  - job_name: geo-service
    static_configs:
      - targets: ['geo-service:8000']

  - job_name: auth-service
    static_configs:
      - targets: ['auth-service:8000']

  - job_name: dashboard-bff
    static_configs:
      - targets: ['dashboard-bff:8000']

  - job_name: redpanda
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: /public_metrics
